services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env.hetzner
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.hetzner:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boerse_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-boerse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boerse} -d ${POSTGRES_DB:-boerse_dashboard}"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-512mb}", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  migrate:
    image: ghcr.io/${GHCR_OWNER:-druckkette}/boerse-dashboard-web-backend:${IMAGE_TAG:-latest}
    restart: "no"
    profiles: ["migrate"]
    env_file:
      - .env.hetzner
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: ghcr.io/${GHCR_OWNER:-druckkette}/boerse-dashboard-web-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.hetzner
    environment:
      APP_ENV: hetzner
      BACKEND_CACHE_DIR: /app/.cache
    volumes:
      - backend_cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    image: ghcr.io/${GHCR_OWNER:-druckkette}/boerse-dashboard-web-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.hetzner
    environment:
      APP_ENV: hetzner
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      BACKEND_CACHE_DIR: /app/.cache
    command: ["sh", "-c", "celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --concurrency=$${WORKER_CONCURRENCY:-1} -Q default"]
    volumes:
      - backend_cache:/app/.cache
      - worker_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  interactive-worker:
    image: ghcr.io/${GHCR_OWNER:-druckkette}/boerse-dashboard-web-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.hetzner
    environment:
      APP_ENV: hetzner
      BACKEND_CACHE_DIR: /app/.cache
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=INFO", "--pool=solo", "--concurrency=1", "--hostname=interactive@%h", "-Q", "interactive"]
    volumes:
      - backend_cache:/app/.cache
      - worker_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: ghcr.io/${GHCR_OWNER:-druckkette}/boerse-dashboard-web-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.hetzner
    environment:
      APP_ENV: hetzner
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/${GHCR_OWNER:-druckkette}/boerse-dashboard-web-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.hetzner
    environment:
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://backend:8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  backend_cache:
  worker_logs:
