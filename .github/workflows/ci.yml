name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: ruff check app tests
      - run: pytest

  database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: audit_tests
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d audit_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/audit_tests
      TEST_POSTGRES_URL: postgresql+psycopg://test:test@localhost:5432/audit_tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: alembic upgrade head
      - run: pytest tests/integration/test_price_revisions.py -q

  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend, backend, database-integration]
    steps:
      - uses: actions/checkout@v6
      - name: Build backend image
        run: docker build -f infra/Dockerfile.backend -t boerse-dashboard-web-backend:test .
      - name: Build frontend image
        run: docker build -f infra/Dockerfile.frontend -t boerse-dashboard-web-frontend:test .
