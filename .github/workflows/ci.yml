name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps .
      - run: ruff check app tests
      - run: pytest

  database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: audit_tests
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d audit_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/audit_tests
      TEST_POSTGRES_URL: postgresql+psycopg://test:test@localhost:5432/audit_tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps .
      - run: alembic upgrade head
      - run: pytest tests/integration -q

  beta-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install --require-hashes -r backend/requirements-dev.lock
      - run: pip install --no-deps ./backend
      - name: Test distributed beta admission with Redis
        run: python -m pytest backend/tests/api/test_beta_api.py -q
        env:
          BETA_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      - run: npm ci
        working-directory: frontend
      - name: Use Ubuntu archive for browser dependencies
        run: |
          # Regional Azure mirrors can remain connected while downloading too slowly.
          # Keep suites, components and Signed-By; change only the Ubuntu mirror host.
          sudo find /etc/apt -maxdepth 2 -type f \
            \( -name sources.list -o -name '*.list' -o -name '*.sources' -o -name '*mirrors*.txt' \) \
            -exec sed -i -E \
            's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
          sudo tee /etc/apt/apt.conf.d/99playwright-network >/dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 5
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          BETA_TEST_PYTHON: python
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: beta-browser-test-results
          path: frontend/test-results
          retention-days: 3

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.lock --no-deps --disable-pip
        working-directory: backend

  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend, backend, database-integration, beta-integration, dependency-audit]
    steps:
      - uses: actions/checkout@v6
      - name: Build backend image
        run: docker build -f infra/Dockerfile.backend -t boerse-dashboard-web-backend:test .
      - name: Build frontend image
        run: docker build -f infra/Dockerfile.frontend -t boerse-dashboard-web-frontend:test .
      - name: Verify backend runtime and certificate bundle
        run: >-
          docker run --rm --entrypoint python boerse-dashboard-web-backend:test
          -c 'import certifi; from packaging.version import Version; from app.main import app;
          assert Version(certifi.__version__) >= Version("2026.10.19");
          print(app.title, certifi.__version__)'
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test recovery against both Compose profiles
        run: |
          pip install pytest
          python -m pytest backend/tests/integration/test_restore_profiles.py -q
        env:
          TEST_DOCKER_RESTORE: "1"
